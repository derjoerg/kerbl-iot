name: Create release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub release
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kerbl-iot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - id: version
        name: Detect version change
        shell: bash
        run: |
          current_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          previous_version=$(git show HEAD^:pyproject.toml 2>/dev/null | python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])' || true)

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Project version did not change."
            exit 0
          fi

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: $current_version" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Release $VERSION" "$COMMIT_SHA"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --target "$COMMIT_SHA"

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: python -m pip install --upgrade build twine && python -m build && python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1